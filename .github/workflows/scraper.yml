name: Google Maps Sade Review Scraper (HTTP Engine)

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HTTP Web Scraper
        run: |
          python scrape_sade_reviews.py

      - name: Upload CSV Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sade-reviews-dataset
          path: sade_village_reviews_clean_5000.csv
          if-no-files-found: warn

      - name: Commit and Push Clean Dataset
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sade_village_reviews_clean_5000.csv sade_checkpoint.json || true
          git commit -m "auto: update sade village reviews dataset via HTTP Engine [skip ci]" || echo "Tidak ada perubahan data."
          git push
