name: Google Maps Sade Review Scraper

on:
  workflow_dispatch: # Tombol manual untuk menjalankan scraper dari UI GitHub
  schedule:
    - cron: '0 0 * * 0' # Berjalan otomatis seminggu sekali (Hari Minggu)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Lingkungan Python 3.13
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 3. Install Chrome Browser & Xvfb (Virtual Screen Display)
      - name: Install Chrome and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      # 4. Install Dependencies Python
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Jalankan Scraping dengan Xvfb (Virtual Display GUI Mode)
      - name: Run Web Scraper
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scrape_sade_reviews.py

      # 6. Simpan File CSV Dataset ke Repository GitHub secara Otomatis
      - name: Commit and Push Clean Dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sade_village_reviews_clean_5000.csv sade_checkpoint.json || true
          git commit -m "auto: update sade village reviews dataset [skip ci]" || echo "Tidak ada perubahan data."
          git push
